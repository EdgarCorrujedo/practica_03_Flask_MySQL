<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Alumnos</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 700px;
            margin: 0 auto;
            background: #fff;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        h2, h3 {
            color: #333;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input[type="text"], input[type="date"], textarea {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .hobbies-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        .hobby-category {
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            padding: 10px;
            background: #fafafa;
        }
        .hobby-category h4 {
            margin-top: 0;
            margin-bottom: 8px;
            font-size: 14px;
        }
        .hobby-item {
            display: block;
            margin-bottom: 5px;
            font-size: 13px;
        }
        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #0056b3;
        }
        a {
            display: inline-block;
            margin-top: 15px;
            color: #007bff;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Registro de alumnos (MySQL)</h2>

    <!-- RUTA CORREGIDA PARA ENVIAR EL FORMULARIO -->
    <form action="/registrar" method="POST">
        
        <div class="form-group">
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" name="nombre" required>
        </div>

        <div class="form-group">
            <label for="fecha_nacimiento">Fecha de nacimiento / Cumpleaños:</label>
            <input type="date" id="fecha_nacimiento" name="fecha_nacimiento" required>
        </div>

        <h3>Selecciona tus pasatiempos</h3>
        
        <div class="hobbies-grid">
            <div class="hobby-category">
                <h4>Deportivos</h4>
                <label class="hobby-item"><input type="checkbox" name="pasatiempos" value="Fútbol"> Fútbol</label>
                <label class="hobby-item"><input type="checkbox" name="pasatiempos" value="Béisbol"> Béisbol</label>
                <label class="hobby-item"><input type="checkbox" name="pasatiempos" value="Ciclismo"> Ciclismo</label>
                <label class="hobby-item"><input type="checkbox" name="pasatiempos" value="Caminar"> Caminar</label>
            </div>

            <div class="hobby-category">
                <h4>Culturales</h4>
                <label class="hobby-item"><input type="checkbox" name="pasatiempos" value="Lectura"> Lectura</label>
                <label class="hobby-item"><input type="checkbox" name="pasatiempos" value="Música"> Música</label>
                <label class="hobby-item"><input type="checkbox" name="pasatiempos" value="Pintura"> Pintura</label>
                <label class="hobby-item"><input type="checkbox" name="pasatiempos" value="Teatro"> Teatro</label>
            </div>

            <div class="hobby-category">
                <h4>Esparcimiento</h4>
                <label class="hobby-item"><input type="checkbox" name="pasatiempos" value="Cine"> Cine</label>
                <label class="hobby-item"><input type="checkbox" name="pasatiempos" value="Videojuegos"> Videojuegos</label>
                <label class="hobby-item"><input type="checkbox" name="pasatiempos" value="Viajar"> Viajar</label>
                <label class="hobby-item"><input type="checkbox" name="pasatiempos" value="Series"> Series</label>
            </div>

            <div class="hobby-category">
                <h4>Sociales</h4>
                <label class="hobby-item"><input type="checkbox" name="pasatiempos" value="Reuniones"> Reuniones</label>
                <label class="hobby-item"><input type="checkbox" name="pasatiempos" value="Fiestas"> Fiestas</label>
                <label class="hobby-item"><input type="checkbox" name="pasatiempos" value="Convivir"> Convivir</label>
                <label class="hobby-item"><input type="checkbox" name="pasatiempos" value="Redes sociales"> Redes sociales</label>
            </div>
        </div>

        <div class="form-group">
            <label for="gustos">En pocas palabras, ¿qué te gusta hacer?</label>
            <textarea id="gustos" name="gustos" rows="3"></textarea>
        </div>

        <button type="submit">Registrar</button>
    </form>

    <!-- ENLACE CORREGIDO PARA CONSULTAR ALUMNOS -->
    <br>
    <a href="/alumnos">Ver alumnos registrados</a>
</div>

</body>
</html>
